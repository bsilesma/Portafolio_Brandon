# Configuración del servidor
server.port=8080
spring.main.banner-mode=off
spring.thymeleaf.cache=false

#Firebase Storage
firebase.bucket.name= techshop-1afc9.firebasestorage.app
firebase.storage.path= TechShop
firebase.json.path= firebase
firebase.json.file= techshop-key.json


# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/techshop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Lec10: ejecuta schema.sql y data.sql al arrancar para crear/sembrar las tablas
# de seguridad (rol, usuario, usuario_rol, ruta). Ambos scripts son idempotentes.
spring.sql.init.mode=always

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar SQL en consola para debuggear
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG