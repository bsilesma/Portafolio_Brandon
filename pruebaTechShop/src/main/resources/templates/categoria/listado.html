<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
      
    <!-- 1. Enchufamos el Head global (esto ya trae Bootstrap y los CSS) -->
    <head th:replace="~{general/fragmentos :: head}"></head>
    
    <body>
        <!-- 2. Enchufamos el Header y Navbar global (el que ya reparamos) -->
        <header th:replace="~{general/fragmentos :: header}"></header>

        <!-- 3. Mantenemos los fragmentos locales que SÍ son exclusivos de esta vista -->
        <div th:replace="~{categoria/fragmentos :: banner}"></div>
        <div th:replace="~{categoria/fragmentos :: mostrarToast}"></div>

        <!-- Inicia tu contenido principal -->
        <div class="container mt-3">

            <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/categoria/nuevo}" class="btn btn-primary mb-3">+ Agregar Categoría</a>

            <div class="row">
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Listado de Categorías</h5>
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Descripción</th>
                                        <th>Imagen</th>
                                        <th>Activo</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categorias}">
                                        <td th:text="${cat.idCategoria}"></td>
                                        <td th:text="${cat.descripcion}"></td>

                                        <td>
                                            <img th:if="${cat.rutaImagen != null}"
                                                 th:src="${cat.rutaImagen}"
                                                 width="80" alt="imagen de la categoria"/>
                                        </td>

                                        <td>
                                            <span th:text="${cat.activo} ? 'Activa' : 'Inactiva'"></span>
                                        </td>

                                        <td>
                                            <!-- Estas acciones solo son permitidas por quien tiene perfil ADMIN -->
                                            <form sec:authorize="hasRole('ROLE_ADMIN')" th:action="@{/categoria/eliminar}" method="post" style="display:inline;">
                                                <input type="hidden" name="idCategoria" th:value="${cat.idCategoria}"/>
                                                <button type="submit" class="btn btn-danger btn-sm">🗑 Eliminar</button>
                                            </form>

                                            <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/categoria/modificar/}+${cat.idCategoria}" class="btn btn-warning btn-sm">✏ Actualizar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-white text-center" style="background-color: #28a745;">
                        <div class="card-body">
                            <h6 class="card-title">Total Categorías</h6>
                            <h3 th:text="${totalCategorias}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. Enchufamos el Footer global para mantener la consistencia -->
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
        
    </body>
</html>
