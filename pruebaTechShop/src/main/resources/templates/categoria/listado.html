<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Listado de Categorías</title>
        <link rel="stylesheet" 
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body>

        <div th:replace="~{categoria/fragmentos :: navbar}"></div>

        <div th:replace="~{categoria/fragmentos :: banner}"></div>

        <div th:replace="~{categoria/fragmentos :: mostrarToast}"></div>

        <div class="container mt-3">

            <a th:href="@{/categoria/nuevo}" class="btn btn-primary mb-3">+ Agregar Categoría</a>

            <div class="row">
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Listado de Categorías</h5>
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Descripción</th>
                                        <th>Imagen</th>
                                        <th>Activo</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categorias}">
                                        <td th:text="${cat.idCategoria}"></td>
                                        <td th:text="${cat.descripcion}"></td>

                                        <td>
                                            <img th:if="${cat.rutaImagen != null}"
                                                 th:src="${cat.rutaImagen}"
                                                 width="80" alt="imagen"/>
                                        </td>

                                        <td>
                                            <span th:text="${cat.activo} ? 'Activa' : 'Inactiva'"></span>
                                        </td>

                                        <td>
                                            <form th:action="@{/categoria/eliminar}" method="post" style="display:inline;">
                                                <input type="hidden" name="idCategoria" th:value="${cat.idCategoria}"/>
                                                <button type="submit" class="btn btn-danger btn-sm">🗑 Eliminar</button>
                                            </form>

                                            <a th:href="@{/categoria/modificar/}+${cat.idCategoria}" class="btn btn-warning btn-sm">✏ Actualizar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-white text-center" style="background-color: #28a745;">
                        <div class="card-body">
                            <h6 class="card-title">Total Categorías</h6>
                            <h3 th:text="${totalCategorias}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
