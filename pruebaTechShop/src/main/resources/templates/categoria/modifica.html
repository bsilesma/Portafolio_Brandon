<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>TechShop - Agregar/Modificar</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container mt-5">
            <h2>Gestión de Categoría</h2>
            <hr/>

            <form th:action="@{/categoria/guardar}" 
                  method="POST" 
                  th:object="${categoria}" 
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{idCategoria}" />

                <div class="mb-3">
                    <label>Descripción:</label>
                    <input type="text" class="form-control" th:field="*{descripcion}" required="true"/>
                </div>

                <div class="mb-3">
                    <label>Activo:</label>
                    <input type="checkbox" th:field="*{activo}"/>
                </div>

                <div class="mb-3">
                    <label>Imagen:</label>
                    <input type="file" name="imagenFile" class="form-control" onchange="mostrarImagen(this);"/>
                    <img id="blah" src="#" alt="Vista previa" style="width:200px; margin-top:10px;"/>
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/categoria/listado}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
