<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <!-- FRAGMENTO HEAD -->
    <head th:fragment="head">
        <title>TechShop</title>
        <meta charset="UTF-8"/>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>

        <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
        <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
        <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
    </head>

    <body>

        <!-- FRAGMENTO HEADER -->
        <header th:fragment="header" class="header">
            <nav class="navbar navbar-expand-sm p-0">
                <div class="container">
                    <a th:href="@{/}" class="navbar-brand">[[#{aplicacion.titulo}]]</a>
                    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                        <ul class="navbar-nav">
                            <!-- Solo ADMIN o VENDEDOR ven los listados -->
                            <li class="nav-item px-2" sec:authorize="hasRole('ROLE_VENDEDOR') or hasRole('ROLE_ADMIN')">
                                <a class="nav-link" th:href="@{/categoria/listado}">[[#{plantilla.categorias}]]</a>
                            </li>
                            <li class="nav-item px-2" sec:authorize="hasRole('ROLE_VENDEDOR') or hasRole('ROLE_ADMIN')">
                                <a class="nav-link" th:href="@{/producto/listado}">Productos</a>                    </li>
                            <li class="nav-item px-2">
                                <a class="nav-link" th:href="@{/pruebas/listado}">Consultas</a>
                            </li>
                        </ul>
                        <ul class="navbar-nav">
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
                                   href="#" role="button" aria-expanded="false">
                                    [[#{plantilla.idioma}]]
                                </a>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" th:href="@{/(lang=es)}">Español</a></li>
                                    <li><a class="dropdown-item" th:href="@{/(lang=en)}">English</a></li>
                                    <li><a class="dropdown-item" th:href="@{/(lang=fr)}">Française</a></li>
                                    <li><a class="dropdown-item" th:href="@{/(lang=pt)}">Portugaise</a></li>
                                </ul>
                            </li>
                            <!-- Ícono para hacer login (solo si NO hay sesión) -->
                            <li class="nav-item px-2" sec:authorize="!isAuthenticated()">
                                <a class="nav-link" th:href="@{/login}" th:title="#{login.login}">
                                    <i class="fas fa-sign-in-alt"></i> [[#{login.login}]]
                                </a>
                            </li>
                            <!-- Foto y nombre del usuario autenticado (la foto la guarda
                                 UsuarioDetailsService en la sesión al hacer login) -->
                            <li class="nav-item px-2" sec:authorize="isAuthenticated()">
                                <span class="nav-link">
                                    <img th:src="@{${session.imagenUsuario}}"
                                         alt="your image" height="40" class="rounded-circle"/>
                                    <span sec:authentication="name" class="ms-1">usuario</span>
                                </span>
                            </li>
                            <!-- Ícono para logout (solo con sesión activa) -->
                            <li class="nav-item px-2" sec:authorize="isAuthenticated()">
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <button type="submit" class="nav-link btn btn-link p-0 border-0 text-reset" style="line-height: inherit;" title="Logout">
                                        <i class="fas fa-sign-out-alt"></i>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
            <section id="main-header" class="py-2 bg-success text-white">
                <div class="container">
                    <div class="row">
                        <div class="col-md-6">
                            <h1><i class="fas fa-cog"></i> [[#{plantilla.suTienda}]]</h1>
                        </div>
                    </div>
                </div>
            </section>
        </header>

        <!-- FRAGMENTO FOOTER -->
        <footer th:fragment="footer" class="p-2 mt-5 bg-info text-white">
            <p class="lead text-center">[[#{plantilla.derechos}]] &copy;</p>
        </footer>

    </body>
</html>
