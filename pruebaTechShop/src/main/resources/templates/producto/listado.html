<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
      
    <head th:replace="~{general/fragmentos :: head}"></head>
    
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <div class="container mt-3">

            <div th:replace="~{producto/fragmentos :: agregar}"></div>

            <div class="row">
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Listado de Productos</h5>
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Descripción</th>
                                        <th>Categoría</th>
                                        <th>Precio</th>
                                        <th>Inv.</th>
                                        <th>Imagen</th>
                                        <th>Activo</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="prod : ${productos}">
                                        <td th:text="${prod.idProducto}"></td>
                                        <td th:text="${prod.descripcion}"></td>
                                        
                                        <td th:text="${prod.categoria.descripcion}"></td>
                                        
                                        <td th:text="${prod.precio}"></td>
                                        <td th:text="${prod.existencias}"></td>

                                        <td>
                                            <img th:if="${prod.rutaImagen != null}"
                                                 th:src="${prod.rutaImagen}"
                                                 width="80" alt="imagen del producto"/>
                                        </td>

                                        <td>
                                            <span th:text="${prod.activo} ? 'Sí' : 'No'"></span>
                                        </td>

                                        <td>
                                            <form th:action="@{/producto/eliminar}" method="post" style="display:inline;">
                                                <input type="hidden" name="idProducto" th:value="${prod.idProducto}"/>
                                                <button type="submit" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                                            </form>

                                            <a th:href="@{/producto/modificar/}+${prod.idProducto}" class="btn btn-warning btn-sm"><i class="fas fa-pen"></i></a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-white text-center" style="background-color: #17a2b8;">
                        <div class="card-body">
                            <h6 class="card-title">Total Productos</h6>
                            <h3 th:text="${totalProductos}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
        
    </body>
</html>
