<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Listado de Productos</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div th:replace="~{categoria/fragmentos :: navbar}"></div>
        <div th:replace="~{categoria/fragmentos :: banner}"></div>
        <div th:replace="~{categoria/fragmentos :: mostrarToast}"></div>

        <div class="container mt-3">

            <div th:replace="~{producto/fragmentos :: agregar}"></div>

            <div class="row">
                <div class="col-md-10">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Listado de Productos</h5>
                            <table class="table table-striped text-center">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Descripción</th>
                                        <th>Categoría</th>
                                        <th>Precio</th>
                                        <th>Inv.</th>
                                        <th>Imagen</th>
                                        <th>Activo</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="prod : ${productos}">
                                        <td th:text="${prod.idProducto}"></td>
                                        <td th:text="${prod.descripcion}"></td>
                                        <td th:text="${prod.categoria.descripcion}"></td>
                                        <td th:text="${prod.precio}"></td>
                                        <td th:text="${prod.existencias}"></td>
                                        <td>
                                            <img th:if="${prod.rutaImagen != null}" th:src="${prod.rutaImagen}" width="60" alt="imagen"/>
                                        </td>
                                        <td><span th:text="${prod.activo} ? 'Sí' : 'No'"></span></td>
                                        <td>
                                            <form th:action="@{/producto/eliminar}" method="post" style="display:inline;">
                                                <input type="hidden" name="idProducto" th:value="${prod.idProducto}"/>
                                                <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                                            </form>
                                            <a th:href="@{/producto/modificar/}+${prod.idProducto}" class="btn btn-warning btn-sm">✏</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-md-2">
                    <div class="card text-white text-center" style="background-color: #17a2b8;">
                        <div class="card-body">
                            <h6 class="card-title">Total Productos</h6>
                            <h3 th:text="${totalProductos}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
