<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>TechShop - Modificar Producto</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div th:replace="~{categoria/fragmentos :: navbar}"></div>

        <div class="container mt-5 mb-5">
            <h2>Modificar Producto</h2>
            <hr/>

            <form th:action="@{/producto/guardar}" method="POST" th:object="${producto}" enctype="multipart/form-data">
                <input type="hidden" th:field="*{idProducto}" />

                <div class="mb-3">
                    <label>Categoría:</label>
                    <select th:field="*{categoria.idCategoria}" class="form-select" required>
                        <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.descripcion}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Descripción:</label>
                    <input type="text" class="form-control" th:field="*{descripcion}" required/>
                </div>

                <div class="mb-3">
                    <label>Detalle:</label>
                    <textarea class="form-control" th:field="*{detalle}" rows="3"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Precio:</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{precio}" required/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Existencias:</label>
                        <input type="number" class="form-control" th:field="*{existencias}" required/>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Activo:</label>
                    <input type="checkbox" class="form-check-input" th:field="*{activo}"/>
                </div>

                <div class="mb-3">
                    <label>Imagen:</label>
                    <input type="file" name="imagenFile" class="form-control" onchange="mostrarImagen(this);"/>
                    <img id="blah" th:src="${producto.rutaImagen != null ? producto.rutaImagen : '#'}" alt="Vista previa" style="width:200px; margin-top:10px;"/>
                </div>

                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                <a th:href="@{/producto/listado}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
